version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps the pins (and their version
  # comments) current. The composite action lives outside .github/workflows,
  # so it's listed separately.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
