name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR supersedes its previous run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    # Keep this name: the main branch ruleset requires a check by this name.
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        working-directory: apps/web
        run: pnpm exec eslint . --format @microsoft/eslint-formatter-sarif --output-file ../../eslint-results.sarif

      # Runs even if web lint failed, so one run reports both apps.
      - name: Lint mobile
        if: ${{ !cancelled() }}
        run: pnpm --filter @moviewatchlist/mobile lint

      # Upload even when lint fails, so the findings show up as annotations.
      - name: Upload analysis results to GitHub
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  react-doctor:
    name: React Doctor
    # Scans only what the PR changes, so it reports issues the PR introduces
    # rather than failing every PR on existing ones.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --scope changed diffs against the base branch, so it needs history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm react-doctor -- --scope changed --base origin/${{ github.base_ref }}

  # Preview builds are disabled in Cloudflare, so nothing else validates the
  # Worker bundle before merge. `next build` and `eslint` don't touch the
  # adapter — and the adapter is where this has actually broken: Next 16 pins
  # proxy.ts to the Node runtime, OpenNext supports only edge middleware, and
  # `next build` passes straight through that. The failure only appeared on
  # deploy, after merge.
  worker-build:
    name: Build the Cloudflare Worker
    runs-on: ubuntu-latest
    # The app's public build-time env, shared with the e2e job below.
    # NEXT_PUBLIC_* values are inlined at build time, so a build without them is
    # not the bundle that ships. They end up in the browser bundle anyway, so
    # they aren't secret; the real secrets (TMDB_API_KEY, the E2E sign-in) are
    # set only on the steps that need them, never on setup or install.
    env: &public-app-env
      NEXT_PUBLIC_API_URL: https://api.themoviedb.org/3
      NEXT_PUBLIC_API_IMAGE_PATH: https://image.tmdb.org/t/p/
      # Asserted against directly by the metadata specs, so it must match what
      # the app renders. No trailing slash.
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build Worker
        env:
          # Server-only; the app reads TMDB_API_KEY, not NEXT_PUBLIC_API_KEY.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: pnpm run cf:build

      # `cf:build` succeeding is not quite proof: the adapter can finish and
      # still leave nothing to deploy, which is how the first Cloudflare deploy
      # failed ("Missing entry-point to Worker script").
      - name: Verify the Worker entry point exists
        run: test -f apps/web/.open-next/worker.js

  e2e:
    name: Playwright tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env: *public-app-env
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      # playwright.config.ts serves `next start` under CI rather than
      # `next dev`, so the build has to exist first.
      - name: Build
        env:
          # Server-only; the app reads TMDB_API_KEY, not NEXT_PUBLIC_API_KEY.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: pnpm run build

      - name: Run Playwright tests
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Sign-in for the protected-route specs. Secrets, not variables:
          # variables are readable by anyone with repo access and appear in logs.
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
