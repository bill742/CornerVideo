name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup errors out if it is given one while
      # the root package.json also sets `packageManager`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
        working-directory: apps/web

      # playwright.config.ts serves `next start` under CI rather than `next dev`,
      # so the build has to exist first. NEXT_PUBLIC_* values are inlined at
      # build time, so this step needs the same env as the test step.
      - name: Build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXT_PUBLIC_API_URL: https://api.themoviedb.org/3
          NEXT_PUBLIC_API_IMAGE_PATH: https://image.tmdb.org/t/p/
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm run build
        working-directory: apps/web

      - name: Run Playwright tests
        env:
          # Server-only since the token moved off the client; the app reads
          # TMDB_API_KEY, not NEXT_PUBLIC_API_KEY.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXT_PUBLIC_API_URL: https://api.themoviedb.org/3
          NEXT_PUBLIC_API_IMAGE_PATH: https://image.tmdb.org/t/p/
          # Both are asserted against directly by the metadata specs, so they
          # must match what the app renders. No trailing slash on the URL.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # proxy.ts builds a Supabase client on every page request and
          # non-null-asserts these, so the app 500s without them.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Sign-in for the protected-route specs. Secrets, not variables:
          # variables are readable by anyone with repo access and appear in logs.
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm exec playwright test
        working-directory: apps/web

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
